name: Reproducible build

# Two machines build the same commit, unsigned, and every file must come out with the same
# SHA-256, except the two named in KNOWN_DIFFERENT below. Each machine also packs its staged
# folder a second time: the two setup programs must be identical, so packing adds no difference.
# Runs when something that shapes the output changes, weekly (the machine image changes), and
# by hand.
on:
  pull_request:
    paths:
      - '.github/workflows/reproducible.yml'
      - 'build.ps1'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'global.json'
      - 'installer/**'
      - 'scripts/**'
      - 'src/**/*.csproj'
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions: {}

concurrency:
  group: reproducible-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 45
    strategy:
      matrix:
        copy: [first, second]

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Build, publish and pack
        shell: pwsh
        run: ./build.ps1 -Locked -NoTests -Installer -Version 0.0.0-repro

      - name: Pack the same folder again
        shell: pwsh
        run: |
          ./scripts/pack.ps1 -Stage artifacts/stage -Version 0.0.0-repro -Out artifacts/installer-again
          $name = 'SecReview-0.0.0-repro-setup.exe'
          $first = (Get-FileHash "artifacts/installer/$name").Hash
          $again = (Get-FileHash "artifacts/installer-again/$name").Hash
          if ($first -ne $again) { throw "Packing one folder twice gave two setup programs ($first, $again)." }
          "Packed twice: identical ($first)."

      - name: Hash the output
        shell: pwsh
        run: |
          $lines = foreach ($folder in 'artifacts/stage', 'artifacts/installer') {
              $base = (Resolve-Path $folder).Path
              Get-ChildItem $base -Recurse -File | ForEach-Object {
                  $name = $_.FullName.Substring($base.Length + 1).Replace('\', '/')
                  "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash)  $folder/$name"
              }
          }
          $lines | Sort-Object { $_.Substring(66) } | Set-Content -Path hashes.txt
          "$($lines.Count) files hashed."

      - name: Upload the hashes
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hashes-${{ matrix.copy }}
          path: hashes.txt
          retention-days: 7
          if-no-files-found: error

  compare:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    permissions: {}

    env:
      # Microsoft's WinRT source generator (CsWinRT) writes its classes in an order that changes
      # from one compiler process to the next, so the window program differs, and with it the
      # setup program that packs it.
      KNOWN_DIFFERENT: |
        artifacts/stage/SecReview.exe
        artifacts/installer/SecReview-0.0.0-repro-setup.exe

    steps:
      - name: Download the hashes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: hashes-*

      - name: Compare
        run: |
          sed -i 's/\r$//' hashes-first/hashes.txt hashes-second/hashes.txt
          known=$(printf '%s\n' "$KNOWN_DIFFERENT" | sed '/^$/d' | sort)
          differ=$(join -j 2 -o 0,1.1,2.1 <(sort -k2 hashes-first/hashes.txt) <(sort -k2 hashes-second/hashes.txt) | awk '$2 != $3 { print $1 }' | sort)
          missing=$(diff <(awk '{ print $2 }' hashes-first/hashes.txt | sort) <(awk '{ print $2 }' hashes-second/hashes.txt | sort) || true)
          unexpected=$(comm -23 <(echo "$differ") <(echo "$known") | sed '/^$/d')
          now_same=$(comm -13 <(echo "$differ") <(echo "$known") | sed '/^$/d')
          total=$(wc -l < hashes-first/hashes.txt)
          report() { echo "$1" | tee -a "$GITHUB_STEP_SUMMARY"; }
          report "$total files; known to differ: $(echo "$known" | wc -l)."
          if [ -n "$now_same" ] && [ -z "$missing" ]; then report "Now identical, take off the known list: $now_same"; fi
          if [ -n "$missing" ]; then report "Files in one build only: $missing"; fi
          if [ -n "$unexpected" ]; then report "Differ unexpectedly: $unexpected"; fi
          if [ -n "$missing" ] || [ -n "$unexpected" ]; then exit 1; fi
